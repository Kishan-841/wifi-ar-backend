# nginx site for the WiFi AR API. Same pattern as the other backends on this
# host: TLS terminated by nginx, proxied to a localhost port.
#
# Hostname: no domain is needed. 202-136-68-13.sslip.io is resolved by the
# public sslip.io DNS service to 202.136.68.13 (the IP is inside the name),
# and Let's Encrypt issues ordinary certificates for it. If the VM's IP ever
# changes, change the name here and in deploy/.env, and rebuild the APK.
#
# Install (on the VM):
#   sudo cp ~/wifi-ar-backend/deploy/nginx/wifi-ar.conf /etc/nginx/sites-available/wifi-ar
#   sudo ln -s /etc/nginx/sites-available/wifi-ar /etc/nginx/sites-enabled/wifi-ar
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 202-136-68-13.sslip.io
#
# certbot rewrites this file to add the `listen 443 ssl` block, the
# certificate paths and an http→https redirect, and renews automatically.

server {
    listen 80;
    listen [::]:80;
    server_name 202-136-68-13.sslip.io;

    # A whole room arrives as one JSON POST; the API caps it at 10 MB too.
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
