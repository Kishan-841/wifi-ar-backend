# WiFi AR backend on the VM: PostgreSQL + API.
#
#   cp .env.example .env   (then edit)
#   docker compose up -d --build
#   docker compose exec api npm run seed:admin      (first time only)
#
# TLS and the public hostname are handled by the host's nginx (see nginx/),
# which proxies https://202-136-68-13.sslip.io → 127.0.0.1:PUBLIC_PORT.
# The API is bound to localhost only and Postgres publishes nothing, so
# neither is reachable from the internet directly.

# Fixed project name: volumes and network become wifi-ar_*, never colliding
# with another repo's deploy/ folder on the same host.
name: wifi-ar

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wifiar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: wifiar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wifiar -d wifiar"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://wifiar:${POSTGRES_PASSWORD}@db:5432/wifiar
      PORT: 4000
      # Used only by `npm run seed:admin`; the server itself ignores these.
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      # localhost only: nginx is the sole public entry point
      - "127.0.0.1:${PUBLIC_PORT:-8080}:4000"

volumes:
  pgdata:
